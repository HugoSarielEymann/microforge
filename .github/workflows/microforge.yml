name: MicroForge

# Vérifie que l'outil et l'intégralité de la bibliothèque restent conformes.
# Le contrôle décisif est le dernier : chaque micropackage doit repasser le
# validateur, y compris ceux publiés il y a longtemps. Une règle durcie dans
# RULES.md invalide alors visiblement les packages qui ne la respectent plus.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Deux SDK : le 8 fournit le pack de ciblage net8.0, le 9 sert de secours si
      # une règle d'analyse diffère entre versions. global.json arbitre lequel est
      # réellement utilisé, et garantit que CI et poste de développement s'accordent.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      # Premier réflexe en cas d'échec : savoir sur quoi on tourne réellement.
      - name: Environnement
        run: |
          dotnet --info
          echo "--- SDK installés ---"
          dotnet --list-sdks

      # --verbosity normal : sans cela, un échec de compilation ne montre pas la
      # ligne fautive dans le journal de la CI.
      - name: Compiler le CLI
        run: dotnet build tools/SnippetForge -c Release --nologo --verbosity normal

      - name: Tester le CLI
        run: dotnet test tools/SnippetForge.Tests -c Release --nologo --verbosity normal

      - name: Tester chaque micropackage
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          for package in packages/*/; do
            [ -d "${package}tests" ] || continue
            id=$(basename "$package")
            echo "::group::$id"
            # Un package hors .NET n'a pas de projet MSBuild : « dotnet test » y
            # échouerait sur l'absence de fichier projet, pas sur un vrai défaut.
            # Chaque écosystème a son lanceur ; on l'appelle, et on refuse de faire
            # passer pour « testé » un package dont on n'a rien exécuté.
            if [ -f "${package}microforge.json" ]; then
              langue=$(sed -n 's/.*"language"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' \
                "${package}microforge.json" | head -1)
              case "$langue" in
                python)
                  python -m pip install --quiet pytest
                  if ! python -m pytest "${package}tests" -q; then
                    echo "::error::Tests en échec pour $id"
                    failed=1
                  fi
                  ;;
                *)
                  echo "::warning::$id ($langue) : aucun lanceur de tests configuré dans cette CI." \
                       "Les tests existent et sont exigés, mais ne sont pas exécutés ici."
                  ;;
              esac
            elif ! dotnet test "${package}tests" -c Release --nologo --verbosity normal; then
              echo "::error::Tests en échec pour $id"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed

      - name: Valider chaque micropackage contre RULES.md
        shell: bash
        env:
          MICROFORGE_ROOT: ${{ github.workspace }}
        run: |
          set -uo pipefail
          forge="dotnet tools/SnippetForge/bin/Release/net8.0/SnippetForge.dll"
          failed=0
          for package in packages/*/; do
            id=$(basename "$package")
            [ -d "${package}src" ] || continue
            # --skip-tests : ils viennent d'être exécutés à l'étape précédente.
            # --offline : pas de modèle d'embedding sur un agent CI.
            if ! $forge validate "$id" --skip-tests --offline; then
              echo "::error::$id ne respecte plus RULES.md"
              failed=1
            fi
          done
          exit $failed

      - name: Signaler les quasi-doublons
        shell: bash
        env:
          MICROFORGE_ROOT: ${{ github.workspace }}
        continue-on-error: true
        run: dotnet tools/SnippetForge/bin/Release/net8.0/SnippetForge.dll duplicates --offline
